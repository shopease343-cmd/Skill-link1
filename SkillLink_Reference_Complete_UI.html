<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillLink — Learn • Build • Earn • Grow</title>
<style>
:root{--navy:#061426;--navy2:#0a1d35;--blue:#1677ff;--cyan:#19c9ff;--purple:#6945ff;--text:#12213b;--muted:#71819a;--white:#fff;--line:#dfe7f2;--green:#14b981;--orange:#ff9b22;--red:#ef4f65;--shadow:0 12px 35px #13264d12}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial;background:#f7f9fc;color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.topbar{height:72px;background:var(--navy);color:white;display:flex;align-items:center;padding:0 5%;gap:35px;position:sticky;top:0;z-index:50}
.brand{font-weight:900;font-size:25px;letter-spacing:.3px;white-space:nowrap}.brand b{color:#25caff}.brand small{display:block;font-size:7px;letter-spacing:3px;color:#8ca6c5;margin-left:32px;margin-top:-4px}
.public-nav{display:flex;gap:24px;margin-left:auto}.public-nav button{background:none;color:#dbe8f7;font-size:13px}.public-nav button:hover{color:white}.login-btn{background:linear-gradient(90deg,#6d3dff,#087dff)!important;color:white!important;padding:11px 27px;border-radius:9px}
.hero{min-height:560px;background:linear-gradient(90deg,#07172b 0%,#0a1d38 50%,#102a4e 100%);position:relative;overflow:hidden;color:white;display:flex;align-items:center;padding:65px 8%}
.hero:after{content:"";position:absolute;right:-10%;bottom:-55%;width:65%;height:130%;background:radial-gradient(circle,#275d92aa,transparent 62%);transform:rotate(-12deg)}
.hero-content{max-width:680px;position:relative;z-index:2}.eyebrow{display:inline-block;border:1px solid #4a6b91;border-radius:20px;padding:7px 13px;font-size:11px;color:#cfe0f4}
.hero h1{font-size:58px;line-height:1.02;margin:22px 0 16px;letter-spacing:-2px}.gradient{background:linear-gradient(90deg,#fff,#36c9ff,#7a55ff);-webkit-background-clip:text;color:transparent}.hero p{font-size:17px;line-height:1.7;color:#b7c9dd;max-width:590px}
.cta{display:flex;gap:12px;margin-top:25px}.primary{background:linear-gradient(90deg,#1678ff,#6746ff);color:white;padding:14px 22px;border-radius:9px;font-weight:800}.outline{background:transparent;color:white;border:1px solid #5d7693;padding:13px 22px;border-radius:9px;font-weight:700}
.trust{display:flex;gap:22px;margin-top:30px;font-size:12px;color:#bdebdc}.stats{background:white;display:grid;grid-template-columns:repeat(4,1fr);padding:28px 8%;gap:15px}.stat{text-align:center;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat strong{display:block;font-size:28px;color:#14294a}.stat span{color:var(--muted);font-size:12px}
.section{padding:65px 7%;max-width:1400px;margin:auto}.section-head{text-align:center;margin-bottom:35px}.section-head h2{font-size:35px;margin:8px}.section-head p{color:var(--muted)}
.feature-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.feature{background:white;border:1px solid var(--line);border-radius:14px;padding:25px;box-shadow:var(--shadow)}.icon{width:45px;height:45px;border-radius:12px;display:grid;place-items:center;background:#edf4ff;color:#1678ff;font-weight:900}.feature h3{font-size:15px}.feature p{font-size:12px;color:var(--muted);line-height:1.5}
.package-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.package{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);position:relative}.package.popular{border:2px solid #6746ff;transform:translateY(-8px)}.badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#6746ff;color:white;border-radius:20px;padding:5px 12px;font-size:10px}.package h3{margin:4px 0}.package .price{font-size:27px;font-weight:900;margin:12px 0}.package p,.package li{font-size:11px;color:var(--muted)}.package ul{padding-left:16px;line-height:1.8}.package button{width:100%;margin-top:10px}
.project-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.project{background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden}.project-img{height:125px;background:linear-gradient(135deg,#dcecff,#769ac4);display:grid;place-items:center;color:white;font-weight:900;font-size:18px}.project-body{padding:15px}.project-body h3{font-size:14px;margin:0 0 7px}.project-body p{font-size:11px;color:var(--muted)}.project-body .row{display:flex;justify-content:space-between;font-size:11px}.tag{background:#edf5ff;color:#1678ff;padding:5px 7px;border-radius:5px}
.master-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.master{background:white;border:1px solid var(--line);border-radius:15px;padding:18px;display:flex;gap:15px;align-items:center}.avatar{width:72px;height:72px;border-radius:12px;background:linear-gradient(135deg,#172c54,#5d3fff);display:grid;place-items:center;color:white;font-weight:900}.master h3{margin:0}.master p{font-size:11px;color:var(--muted)}
.dark-cta{margin:20px 7% 60px;background:linear-gradient(110deg,#06172b,#163d6b);border-radius:22px;padding:45px;color:white;display:flex;justify-content:space-between;align-items:center}.dark-cta h2{font-size:32px;margin:0 0 10px}
footer{background:#061426;color:#a9bdd4;padding:45px 7%;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:30px}footer h3{color:white}footer button{display:block;background:none;color:#a9bdd4;padding:6px 0}.copyright{grid-column:1/-1;border-top:1px solid #263d57;padding-top:18px;font-size:11px}
.auth{min-height:100vh;background:linear-gradient(135deg,#061426,#18286a);display:grid;place-items:center;padding:20px}.auth-card{width:min(450px,100%);background:white;border-radius:22px;padding:34px;box-shadow:0 25px 70px #0005}.auth-logo{text-align:center;color:#0b6dff;font-weight:900;font-size:30px}.auth-card h1{text-align:center}.field{margin:14px 0}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid #d7e0eb;border-radius:9px}.auth-card .primary{width:100%;margin-top:8px}.back{background:none;color:#52708f;width:100%;margin-top:12px}
.dashboard{min-height:100vh;background:#f5f8fc}.dash-top{height:65px;background:#071a31;color:white;display:flex;align-items:center;padding:0 20px;gap:20px}.dash-top .search{background:#102a49;border:1px solid #294665;color:white;padding:10px 16px;border-radius:9px;width:min(430px,45vw)}.dash-top .user{margin-left:auto}.dash-layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 65px)}.sidebar{background:#061426;color:white;padding:15px 10px}.side-btn{display:block;width:100%;text-align:left;background:transparent;color:#c5d4e5;padding:11px 12px;border-radius:8px;font-size:12px}.side-btn.active,.side-btn:hover{background:#1678ff;color:white}.dash-main{padding:24px}.dash-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.dash-head h1{font-size:29px;margin:0}.dash-head p{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.kpi{padding:17px;border-radius:12px;color:white;min-height:100px}.kpi:nth-child(1){background:linear-gradient(135deg,#7442ff,#5531d8)}.kpi:nth-child(2){background:linear-gradient(135deg,#1682ff,#2760dd)}.kpi:nth-child(3){background:linear-gradient(135deg,#08b986,#079d75)}.kpi:nth-child(4){background:linear-gradient(135deg,#ff8c1c,#ee6a13)}.kpi:nth-child(5){background:linear-gradient(135deg,#ef526d,#d83a58)}.kpi small{font-size:10px}.kpi strong{display:block;font-size:25px;margin:7px 0}.dash-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:14px}.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:18px}.panel h3{margin:0 0 14px}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #edf1f6}.status{padding:4px 7px;border-radius:5px;font-size:9px;background:#e7f8f1;color:#09875e}.bar{height:9px;background:#edf2f8;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#177aff,#6746ff);width:72%}.level-card{background:linear-gradient(110deg,#07182c,#17365c);color:white;border-radius:15px;padding:22px}.level-num{font-size:55px;font-weight:900;color:#35caff}.action-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.action{border:1px solid var(--line);background:white;border-radius:10px;padding:17px;text-align:center;font-weight:800;font-size:11px;color:#1d3760}
.toast{position:fixed;right:20px;bottom:20px;background:#071a31;color:white;padding:13px 17px;border-radius:10px;z-index:100;box-shadow:0 15px 40px #0004}
@media(max-width:1050px){.package-grid{grid-template-columns:repeat(3,1fr)}.feature-grid,.project-grid{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:750px){.public-nav{display:none}.topbar{justify-content:space-between}.hero{padding:50px 6%}.hero h1{font-size:42px}.stats{grid-template-columns:repeat(2,1fr)}.stat{border:0}.feature-grid,.project-grid,.package-grid,.master-grid{grid-template-columns:1fr}.package.popular{transform:none}.dark-cta{display:block;margin:20px 5%}.dash-layout{grid-template-columns:1fr}.sidebar{display:none}.cards{grid-template-columns:repeat(2,1fr)}.dash-grid{grid-template-columns:1fr}.action-grid{grid-template-columns:repeat(2,1fr)}footer{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const packages=[
{name:"Aarambh",sub:"Digital Foundation",price:"₹499",items:["Computer Basics","Internet & Online Tools","Basic Design","Freelancing Introduction"]},
{name:"Udaan",sub:"Creative + Content Skills",price:"₹999",items:["Video Editing","Graphic Design","Content Creation","Social Media Basics"]},
{name:"Pragati",sub:"Marketing + Client Skills",price:"₹1,999",items:["Digital Marketing","Client Handling","Meta Ads","Personal Branding"],popular:true},
{name:"Brahmastra",sub:"Advanced Digital Skills",price:"₹3,999",items:["Web Development","Advanced Marketing","Automation Tools","E-commerce & Dropshipping"]},
{name:"Shikhar",sub:"Leadership + Business",price:"₹6,999",items:["Business Strategy","Team Building","Leadership","Business Growth"]}];

function home(){
return `<header class="topbar"><div class="brand">S <b>SKILL</b>LINK<small>LEARN • BUILD • EARN • GROW</small></div><nav class="public-nav">
<button onclick="page('home')">Home</button><button onclick="page('packages')">Packages</button><button onclick="page('courses')">Courses</button><button onclick="page('projects')">Projects</button><button onclick="page('partner')">Partner Program</button><button onclick="page('about')">About</button><button onclick="page('faq')">FAQ</button><button onclick="page('contact')">Contact</button></nav><button class="login-btn" onclick="page('login')">Login</button></header>
<section class="hero"><div class="hero-content"><span class="eyebrow">A Platform for Skills, Projects & Real Opportunities</span><h1>Build Skills.<br><span class="gradient">Create Opportunities.</span><br>Grow Together.</h1><p>Learn in-demand digital skills, work on practical projects and build a better future with SkillLink.</p><div class="cta"><button class="primary" onclick="page('partner')">Become a Partner →</button><button class="outline" onclick="page('projects')">Explore Services →</button></div><div class="trust">✓ Real Skills &nbsp; ✓ Real Projects &nbsp; ✓ Transparent Earnings &nbsp; ✓ Growth Journey</div></div></section>
<div class="stats"><div class="stat"><strong>5+</strong><span>Programs</span></div><div class="stat"><strong>32+</strong><span>Courses</span></div><div class="stat"><strong>24+</strong><span>Live Projects</span></div><div class="stat"><strong>1000+</strong><span>Partner Journey</span></div></div>
<section class="section"><div class="section-head"><h2>Everything You Need in One Platform</h2><p>From learning to earning, everything in one place.</p></div><div class="feature-grid">
${[["◈","Learn Skills","High-quality courses with structured learning."],["▣","Get Real Projects","Work on practical client projects."],["♟","Grow Network","Connect with clients and partners."],["₹","Build Earnings","Earn through verified opportunities."]].map(x=>`<div class="feature"><div class="icon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join("")}</div></section>
<section class="section"><div class="section-head"><h2>Popular Packages</h2><p>Choose your learning and growth path.</p></div>${packageCards()}</section>
<section class="section"><div class="section-head"><h2>Latest Projects</h2><p>Practical work opportunities.</p></div>${projectCards()}</section>
<div class="dark-cta"><div><h2>Your Skills Can Take You Places.</h2><p>Learn. Build. Earn. Grow with SkillLink.</p></div><button class="primary" onclick="page('partner')">Start Your Journey →</button></div>${footer()}`;
}
function packageCards(){return `<div class="package-grid">${packages.map((p,i)=>`<article class="package ${p.popular?'popular':''}">${p.popular?'<span class="badge">MOST POPULAR</span>':''}<span class="tag">${i===0?'FOUNDATION':i===4?'LEADERSHIP':'SKILL PROGRAM'}</span><h3>${p.name}</h3><small>${p.sub}</small><div class="price">${p.price}</div><ul>${p.items.map(x=>`<li>✓ ${x}</li>`).join("")}</ul><button class="primary" onclick="page('package',${i})">View Details</button></article>`).join("")}</div>`}
function projectCards(){let p=[["Website Development","₹5,000","HTML • CSS • JavaScript"],["Logo Design","₹2,000","Branding • Design"],["Social Media Management","₹3,500","Marketing • Content"],["Product Video Editing","₹4,000","Video • Editing"]];return `<div class="project-grid">${p.map(x=>`<article class="project"><div class="project-img">${x[0]}</div><div class="project-body"><h3>${x[0]}</h3><p>Build practical client results with verified project workflow.</p><div class="row"><b>${x[1]}</b><span class="tag">${x[2]}</span></div><button class="primary" style="margin-top:12px;width:100%" onclick="page('projects')">View Details</button></div></article>`).join("")}</div>`}
function packagesPage(){return `<header class="topbar"><div class="brand">S <b>SKILL</b>LINK<small>LEARN • BUILD • EARN • GROW</small></div><nav class="public-nav">${nav()}</nav><button class="login-btn" onclick="page('login')">Login</button></header><section class="section"><div class="section-head"><h2>Explore Courses & Programs</h2><p>Choose a package and start learning today.</p></div>${packageCards()}</section>${footer()}`}
function packagePage(i=0){let p=packages[i]||packages[0];return `<header class="topbar"><div class="brand">S <b>SKILL</b>LINK</div><nav class="public-nav">${nav()}</nav><button class="login-btn" onclick="page('login')">Login</button></header><section class="section"><span class="tag">HOME › PACKAGES › ${p.name.toUpperCase()}</span><div style="display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:20px"><div class="panel"><h1 style="font-size:42px;margin:0">${p.name}</h1><p>${p.sub}</p><div class="price">${p.price}</div><button class="primary" onclick="toast('Package purchase requires connected payment verification backend.')">Buy Now</button><hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><p>✓ Lifetime Access<br>✓ Certificate eligibility<br>✓ Project based learning<br>✓ Community support</p></div><div class="panel"><h2>What You Will Learn</h2>${p.items.map(x=>`<p>🟢 ${x}</p>`).join("")}</div></div><div class="panel" style="margin-top:20px"><h2>Courses in ${p.name}</h2>${p.items.map((x,i)=>`<p><b>${i+1}. ${x}</b> — structured lessons, practice and assessment</p>`).join("")}</div></section>${footer()}`}
function courses(){return `<header class="topbar"><div class="brand">S <b>SKILL</b>LINK</div><nav class="public-nav">${nav()}</nav><button class="login-btn" onclick="page('login')">Login</button></header><section class="section"><div class="section-head"><h2>Explore Courses</h2><p>Structured learning from foundation to advanced skills.</p></div><div class="feature-grid">${["Computer Basics","Digital Marketing","Meta Ads","Graphic Design","Video Editing","Web Development","Content Creation","Business Strategy"].map((x,i)=>`<div class="feature"><div class="icon">0${i+1}</div><h3>${x}</h3><p>Lessons → practice → assessment → skill mastery.</p><button class="primary" onclick="toast('Course access requires an active package.')">View Course</button></div>`).join("")}</div></section>${footer()}`}
function projects(){return `<header class="topbar"><div class="brand">S <b>SKILL</b>LINK</div><nav class="public-nav">${nav()}</nav><button class="login-btn" onclick="page('login')">Login</button></header><section class="section"><div class="section-head"><h2>Find Real Projects</h2><p>Work, Learn and Earn through verified project workflows.</p></div>${projectCards()}</section>${footer()}`}
function master(){return `<header class="topbar"><div class="brand">S <b>SKILL</b>LINK</div><nav class="public-nav">${nav()}</nav><button class="login-btn" onclick="page('login')">Login</button></header><section class="section"><div class="section-head"><h2>Live Masterclasses</h2><p>Interactive sessions, real strategies and practical learning.</p></div><div class="master-grid">${["Digital Marketing Masterclass","Video Editing for Beginners","Freelancing Masterclass","Client Communication"].map((x,i)=>`<div class="master"><div class="avatar">${i+1}</div><div><h3>${x}</h3><p>Learn practical strategies and workflows.</p><button class="primary" onclick="toast('Registration requires connected masterclass payment workflow.')">Register Now</button></div></div>`).join("")}</div></section>${footer()}`}
function about(){return simple("About SkillLink","Learn • Build • Earn • Grow","SkillLink is a digital skills and opportunity ecosystem connecting structured learning, practical projects and professional growth.")}
function contact(){return simple("Get in Touch","We are here to help you.","<div class='field'><label>Name</label><input placeholder='Your Name'></div><div class='field'><label>Email</label><input placeholder='Your Email'></div><div class='field'><label>Message</label><textarea rows='5' placeholder='Your Message'></textarea></div><button class='primary' onclick=\"toast('Connect the contact backend before sending messages.')\">Send Message</button>")}
function faq(){return simple("Frequently Asked Questions","SkillLink","<h3>How does the Partner program work?</h3><p>Partners learn skills, complete verified work, use the referral system and progress through levels based on official platform rules.</p><h3>Who approves withdrawals?</h3><p>CEO approval is required for withdrawal processing.</p><h3>Who controls the company QR?</h3><p>The CEO controls replacement and activation of the company payment QR.</p>")}
function partner(){return simple("Partner Program","Build Skills. Build Opportunities.","<p>Learn digital skills, work on verified projects, build your referral network and progress through the SkillLink Level & Reward Journey.</p><div class='feature-grid'><div class='feature'><h3>Learn</h3><p>Structured courses and assessments.</p></div><div class='feature'><h3>Build</h3><p>Practical project experience.</p></div><div class='feature'><h3>Earn</h3><p>Verified project, referral and course-selling earnings.</p></div><div class='feature'><h3>Grow</h3><p>Score, mastery, referrals and rewards.</p></div></div>")}
function simple(title,sub,body){return `<header class="topbar"><div class="brand">S <b>SKILL</b>LINK</div><nav class="public-nav">${nav()}</nav><button class="login-btn" onclick="page('login')">Login</button></header><section class="section"><div class="section-head"><h2>${title}</h2><p>${sub}</p></div><div class="panel">${body}</div></section>${footer()}`}
function nav(){return `<button onclick="page('home')">Home</button><button onclick="page('packages')">Packages</button><button onclick="page('courses')">Courses</button><button onclick="page('projects')">Projects</button><button onclick="page('master')">Masterclass</button><button onclick="page('about')">About</button><button onclick="page('faq')">FAQ</button><button onclick="page('contact')">Contact</button>`}
function footer(){return `<footer><div><div class="brand">S <b>SKILL</b>LINK</div><p>Learn • Build • Earn • Grow</p><p>Digital skills, practical projects and opportunities.</p></div><div><h3>Quick Links</h3><button onclick="page('home')">Home</button><button onclick="page('courses')">Courses</button><button onclick="page('projects')">Projects</button></div><div><h3>Programs</h3>${packages.map((p,i)=>`<button onclick="page('package',${i})">${p.name}</button>`).join("")}</div><div><h3>Support</h3><button onclick="page('faq')">FAQ</button><button onclick="page('contact')">Contact</button><button onclick="page('login')">Login</button></div><div class="copyright">© SkillLink • Learn • Build • Earn • Grow</div></footer>`}
function login(){return `<div class="auth"><div class="auth-card"><div class="auth-logo">S SKILL<span>LINK</span></div><h1>Welcome Back</h1><p style="text-align:center;color:var(--muted)">One Account. Role-based access.</p><div class="field"><label>User ID / Username</label><input id="uid"></div><div class="field"><label>Password</label><input id="pw" type="password"></div><button class="primary" onclick="loginAttempt()">Login</button><button class="back" onclick="page('home')">← Back to website</button><p style="text-align:center;font-size:11px;color:var(--muted)">Forgot Password?</p></div></div>`}
function loginAttempt(){toast("Real authentication requires the connected SkillLink backend. No fake login is used.");}
function dashboard(role){let title=role+" Dashboard";let items=role==="PARTNER"?["Total Earnings","Available Balance","Projects","Referrals","Current Level"]:role==="CLIENT"?["Total Projects","Active Projects","Completed Projects","Total Spent","Submissions"]:["Total Users","Partners","Clients","Revenue","Pending Withdrawals"];return `<div class="dashboard"><div class="dash-top"><div class="brand">S <b>SKILL</b>LINK</div><input class="search" placeholder="Search users, courses, projects, payments..."><div class="user">${role} ▾</div></div><div class="dash-layout"><aside class="sidebar">${["Dashboard","Users","Partners","Clients","Packages","Courses","Masterclasses","Projects","Payments","Earnings & Withdrawals","Referrals","Levels & Rewards","Notifications","Reports","Company QR","Settings"].map((x,i)=>`<button class="side-btn ${i===0?'active':''}" onclick="toast('${x} module opens when backend is connected.')">${x}</button>`).join("")}</aside><main class="dash-main"><div class="dash-head"><div><h1>${title}</h1><p>Welcome back. Here is your SkillLink overview.</p></div><span class="tag">LIVE DATA ONLY</span></div><div class="cards">${items.map((x,i)=>`<div class="kpi"><small>${x}</small><strong>${i===0&&role==="PARTNER"?"₹0":i===4&&role==="PARTNER"?"L1":"0"}</strong><small>Connected data</small></div>`).join("")}</div><div class="dash-grid"><div class="panel"><h3>Overview</h3><div style="height:180px;display:flex;align-items:end;gap:10px;padding:10px">${[35,55,42,75,60,88,70,96].map(h=>`<i style="height:${h}%;flex:1;background:linear-gradient(#2384ff,#6746ff);border-radius:5px 5px 0 0"></i>`).join("")}</div></div><div class="level-card"><div class="level-num">${role==="PARTNER"?"L1":"—"}</div><h2>${role==="PARTNER"?"Starter Journey":"Role Overview"}</h2><p>Official platform values will appear after backend connection.</p><div class="bar"><i></i></div></div></div><div class="panel" style="margin-top:14px"><h3>Recent Activity</h3><table class="table"><tr><th>Activity</th><th>Status</th><th>Date</th></tr><tr><td>No demo activity</td><td><span class="status">Waiting for backend</span></td><td>—</td></tr></table></div><div class="action-grid" style="margin-top:14px">${["Create Partner","Create Client","Create Project","Verify Payments","Manage QR","Withdrawals","View Reports","Notifications"].map(x=>`<button class="action" onclick="toast('${x}: backend action required.')">${x}</button>`).join("")}</div></main></div></div>`}
function page(name,arg){let html=name==="home"?home():name==="packages"?packagesPage():name==="package"?packagePage(arg):name==="courses"?courses():name==="projects"?projects():name==="master"?master():name==="about"?about():name==="contact"?contact():name==="faq"?faq():name==="partner"?partner():name==="login"?login():name==="ceo"?dashboard("CEO"):name==="admin"?dashboard("ADMIN"):name==="partnerDash"?dashboard("PARTNER"):name==="client"?dashboard("CLIENT"):home();document.getElementById("app").innerHTML=html;scrollTo(0,0)}
function toast(msg){let d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}
page("home");
</script>
